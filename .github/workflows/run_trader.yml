name: ICICI Breeze TradingAgents

on:
  workflow_dispatch:
    inputs:
      apisession_token:
        description: "Daily ICICI Breeze apisession token"
        required: false
        type: string
      trading_mode:
        description: "PAPER or LIVE"
        required: false
        type: choice
        options:
          - PAPER
          - LIVE
        default: PAPER

  schedule:
    - cron: '50 3 * * 1-5'  # 9:20 AM IST = 03:50 UTC, Monday-Friday

jobs:
  run-tradingagents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyotp

      - name: Execute trading agents
        env:
          ICICI_API_KEY: ${{ secrets.ICICI_API_KEY }}
          ICICI_API_SECRET: ${{ secrets.ICICI_API_SECRET }}
          ICICI_SESSION_TOKEN: ${{ github.event.inputs.apisession_token || secrets.ICICI_SESSION_TOKEN }}
          ICICI_TOTP_SECRET: ${{ secrets.ICICI_TOTP_SECRET }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TRADING_MODE: ${{ github.event.inputs.trading_mode || secrets.TRADING_MODE || 'PAPER' }}
          TRADING_CAPITAL: ${{ secrets.TRADING_CAPITAL || '100000' }}
          STOPLOSS_PCT: ${{ secrets.STOPLOSS_PCT || '0.010' }}
          TARGET_PCT: ${{ secrets.TARGET_PCT || '0.022' }}
          MAX_DAILY_LOSS: ${{ secrets.MAX_DAILY_LOSS || '1500' }}
          MAX_EXPOSURE_PCT: ${{ secrets.MAX_EXPOSURE_PCT || '0.30' }}
          MAX_RISK_PER_TRADE_PCT: ${{ secrets.MAX_RISK_PER_TRADE_PCT || '0.10' }}
          MAX_OPEN_POSITIONS: ${{ secrets.MAX_OPEN_POSITIONS || '3' }}
        run: |
          python -m tradingagents.runner --mode "$TRADING_MODE"
